<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snap Out - Why are you visiting?</title>
<link rel="stylesheet" href="block.css">
</head>
<body>
<div class="particles"></div>
<div class="container">
  <div class="icon">⏸️</div>
  <h1>Snap Out</h1>
  <div class="blocked-url" id="blockedUrl" aria-live="polite"></div>
  <h2>Why are you visiting this website now?</h2>
  <div class="error-message" id="errorMessage" role="alert"></div>
  <label class="visually-hidden" for="reasonInput">Reason for visiting</label>
  <textarea id="reasonInput" placeholder="Type your reason here..." maxlength="500" autofocus></textarea>
  <div class="char-count" id="charCount">0 characters</div>
  <div class="button-group">
    <button id="continueBtn" class="primary">Continue to Website</button>
    <button id="goBackBtn" class="secondary">Go Back</button>
  </div>
</div>
<script src="block.js"></script>
</body>
</html>
