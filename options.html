<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Snap Out - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="icon">⚙️</div>
      <h1>Snap Out Settings</h1>
      <p class="subtitle">Manage your blocked websites</p>
    </header>
    
    <div class="section">
      <div class="section-header">
        <h2>🚫 Blocked Websites</h2>
        <span class="badge" id="sitesCount">0</span>
      </div>
      <p class="description">Enter domain names to block (e.g., facebook.com, twitter.com)</p>
      
      <div class="input-group">
        <input type="text" id="newSite" placeholder="example.com">
        <button id="addBtn">+ Add Website</button>
      </div>
      
      <div class="status" id="status"></div>
      
      <ul id="sitesList"></ul>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
